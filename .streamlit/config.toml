# Paper and ink: warm stone neutrals, one indigo accent, serif headings.
#
# Provenance: designed for this app in Track F of
# `docs/plans/upgrade-and-deploy.md`, starting from the theme templates'
# `shadcn.toml` (zinc), which this file used to copy unchanged. Kept from it:
# the geometry, the 14px base, the type scale, the fonts for body and code, and
# the semantic palette. Changed on purpose, and no longer diffable against it:
#   - Tailwind **stone** in place of zinc, the same steps in the same roles, so
#     long reading happens on warm paper rather than cool grey;
#   - one **indigo** accent for `primaryColor` and `linkColor`. The template was
#     monochrome, so *Draft proposal* (a billed run) and *Approve* (a write bound
#     for submission) looked like every other dark-grey control. Indigo stays
#     clear of the red, amber, green and blue the status colours use;
#   - **Source Serif 4** for headings, so a page reads like a proposal rather
#     than a console. Body text stays Inter, which is more legible at 14px;
#   - `borderColor` raised to clear 3:1 (WCAG 1.4.11). See the borders note
#     below before lightening it.
# `tests/test_theme_config.py` recomputes every contrast figure quoted here, so
# a colour edit that breaks one fails rather than only making a comment wrong.
#
# Chosen for this app: `showWidgetBorder`, because the layout is built almost
# entirely from `st.container(border=True)`.
#
# This file is the whole styling story. Do not add CSS injection to the app --
# theme tokens here are the supported way to restyle a Streamlit app.
#
# ## Why light and dark are separate sections
#
# A single [theme] block locks the app to one mode, so before the split a reader
# on a dark desktop had no way off the light surface. With both defined the
# settings menu offers System/Light/Dark and lands on **System**, so the mode
# follows the desktop rather than this file.
#
# **Rolling this back is not "delete [theme.dark]".** Verified in 1.60: the
# switch appears when *either* mode section exists, and with only [theme.light]
# present the Dark entry is built from [theme] plus Streamlit's stock dark
# palette -- a #0E1117 page with none of these stone surfaces, which a dark
# desktop then gets by default. That is worse than either the split or the
# original. To actually go back, move [theme.light]'s keys into [theme] and
# delete *both* dark sections.
#
# ## What must NOT move out of [theme]
#
# Seven options exist only in the top-level section: `base`, `baseFontSize`,
# `baseFontWeight`, `fontFaces`, `metricValueFontSize`, `metricValueFontWeight`,
# and `showSidebarBorder`. A misplaced one is not rejected -- Streamlit logs
# `"theme.light.baseFontSize" is not a valid config option` to the *server* log,
# which nobody is watching, and drops the value. So a tidy-up that moves this
# block into both modes silently loses the 14px base size and the sidebar
# border. `tests/test_theme_config.py` is what actually catches that; this
# comment only explains it -- and it derives the set from the installed
# Streamlit rather than from this list, which is why the count moving did not
# turn the suite red.
#
# It moved once already: 1.62 made `chartCategoricalColors`,
# `chartSequentialColors` and `chartDivergingColors` settable per mode and per
# sidebar, taking the count from ten to seven. The categorical ramp below stays
# up top all the same -- it is tuned to read on both surfaces, so defining it
# twice would be two places to drift rather than one place to fix.
#
# Everything else here is valid in all six theme sections (the five below plus
# the unused [theme.sidebar]) and is kept up top because it is genuinely shared:
# geometry, typography, and the semantic palette do not depend on the mode.
#
# The semantic colours stay shared for a measured reason: `:gray[...]` and
# friends do NOT render these values. Streamlit derives a per-mode
# `grayTextColor` from `grayColor` by moving its HSL lightness 0.15 away from the
# page, and renders that. On the dark page `grayColor = #78716C` reaches the
# screen as #9E9793 at 6.87:1 -- past AA, at 36% of body-text contrast, which is
# the de-emphasis `TOOL` rows and `PENDING_TODO_ICON` want. On the light page it
# renders as #504B48 at 8.60:1. Overriding these per mode to "fix contrast"
# measures a token nothing displays and flattens that hierarchy.
#
# ## Borders: one token, two jobs, and the stricter one wins
#
# Streamlit draws input outlines (text inputs, selects, text areas) *and* the
# decorative `st.container(border=True)` boxes from the same `borderColor`, and
# there is no theme-only way to set them apart. An input is identified by its
# outline, so WCAG 1.4.11 asks 3:1 of it against every surface it can sit on.
# The template's light borders reached 1.27:1 on the page. Raising the token to
# pass makes every container visibly heavier, and that was decided as the right
# trade: the inputs are where people type the facts the agent must not invent,
# so finding the field matters more than lighter boxes.
#
# Each value is the lightest-looking one that passes, with a margin, searched
# along the stone scale between 400 and 500 (on a dark page, lightest-looking
# means least contrast, which puts it at the stone-500 end):
#   - light #918A86, worst 3.11:1 (on the light sidebar's stone-100);
#     #938D88, one step lighter, reaches only 3.005 there, with no margin;
#   - dark  #78716C (stone-500), worst 3.16:1 (on the dark sidebar's
#     stone-800). stone-600 falls to 1.99 there.
# The test measures each against all four surfaces in its mode, page and
# secondary, main and sidebar. Lighten one and it fails.
#
# `dataframeBorderColor` keeps the lighter stone steps: a grid line marks no
# control, so it carries no 3:1 obligation.
#
# ## The chart ramp, the one value not changed by the redesign
#
# The template ramp opened on a zinc scale tuned for a white page: #18181B scored
# 1.12:1 on the dark surface, and four of its seven entries fell under 3:1 on at
# least one of the two page backgrounds. The ramp is defined once, in [theme]
# (see the note above on why it isn't split per mode), so one ramp serves both
# surfaces and has to clear both.
#
# The replacement is seven Tailwind steps -- the scale the semantic tokens above
# already use -- searched rather than picked, then checked with the dataviz
# skill's validator against the two pages. Hand-picking failed first on the slot
# that looked safest: slate-500, as a neutral, at chroma 0.041 against a 0.10
# floor, where a hue stops reading as a series and reads as gray. It was validated
# against zinc-950 (#09090B); against stone-950 the worst entry is #B91C1C at
# 3.05:1, still over the floor but by only 0.05.
#
# Verified limits -- **order is load-bearing**, so re-run the validator if you
# touch it:
#   - Line, bar, area, stacked (adjacent pairs): all seven clean, worst CVD
#     dE 8.1, normal-vision dE 24.3.
#   - Scatter, bubble, choropleth (all pairs): **five is the cap.** Six warns
#     (dE 6.9) and seven hard-FAILS (dE 6.6). Past five, fold to "Other" or facet.
#   - Tritanopia is reported but not gated, and it is this ramp's weak axis:
#     dE 6.4 by slot five and 1.8 across all seven, because teal-600 and cyan-600
#     are near-identical under it. A tritan-safe all-pairs chart uses the first
#     four (dE 11.3).
#   - The >=3:1 result covers the two *page* backgrounds only. A chart drawn on
#     another surface is not covered: on the dark sidebar/secondary #1C1917,
#     #A21CAF is 2.77:1 and #B91C1C 2.70:1; on the light code background #F5F5F4,
#     #D97706 is 2.92:1. A sidebar chart needs its own colours.
#
# What one shared token costs: the series separate by hue alone. Clearing 3:1 on
# a white *and* a near-black page confines every entry to a narrow band of
# relative luminance, so lightness is spent on background contrast and cannot
# also separate series. Hence a floor, not the last word: a chart wanting
# lightness separation should pass `color=` per mode, which every Vega command
# accepts. Note `st.context.theme.type` is documented as unreliable on first load
# and immediately after a mode switch (streamlit#11920) -- the two renders where a
# per-mode palette is observable -- and returns None outside a script run, so
# branch on it defensively. A `st.metric` sparkline has no colour argument at
# all, which is why the shared default had to be the safe one.
#
# The app currently draws no charts, so none of this renders yet. It is a floor
# for the first one, not a description of anything on screen.

[theme]
base = "light"
baseFontSize = 14
baseFontWeight = 400
showSidebarBorder = true
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
headingFontSizes = ["36px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true

# Semantic palette. Shared, not per-mode -- Streamlit derives the rendered
# `*TextColor` per mode from each of these; see the note above.
grayColor = "#78716C"  # stone-500, so muted text matches the warm neutrals
blueColor = "#3B82F6"
greenColor = "#22C55E"
redColor = "#EF4444"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#8B5CF6"

# Validated on both page backgrounds; order matters and five is the all-pairs
# cap. See the chart-ramp note above before changing either.
chartCategoricalColors = [
  "#A21CAF",  # fuchsia-700
  "#D97706",  # amber-600
  "#0D9488",  # teal-600
  "#B91C1C",  # red-700
  "#2563EB",  # blue-600
  "#EC4899",  # pink-500
  "#0891B2",  # cyan-600
]

# --- Light: paper and ink -----------------------------------------------------
#
# indigo-700 carries the accent: 7.90:1 as a link on the page, and 7.90:1 under
# the white label Streamlit hardcodes on a primary button. Links keep
# `linkUnderline` as a second cue, so they are not identified by hue alone.

[theme.light]
primaryColor = "#4338CA"              # indigo-700
backgroundColor = "#FFFFFF"           # paper
secondaryBackgroundColor = "#FAFAF9"  # stone-50
codeBackgroundColor = "#F5F5F4"       # stone-100
textColor = "#0C0A09"                 # stone-950, ink
linkColor = "#4338CA"                 # indigo-700
borderColor = "#918A86"               # 3:1 on every light surface; see the borders note
codeTextColor = "#292524"             # stone-800
dataframeBorderColor = "#E7E5E4"      # stone-200
dataframeHeaderBackgroundColor = "#FAFAF9"

[theme.light.sidebar]
backgroundColor = "#FAFAF9"           # stone-50
secondaryBackgroundColor = "#F5F5F4"  # stone-100
codeBackgroundColor = "#E7E5E4"       # stone-200
textColor = "#0C0A09"
borderColor = "#918A86"
primaryColor = "#4338CA"
dataframeHeaderBackgroundColor = "#F5F5F4"
dataframeBorderColor = "#E7E5E4"

# --- Dark: the same scales, inverted ------------------------------------------
#
# Surfaces mirror step for step -- white/stone-50/stone-100/stone-200 above
# becomes stone-950/stone-900/stone-800/stone-700 here -- so the layering that
# separates a bordered container from the page, and a code block from its
# border, survives the flip. The accent keeps its hue and lifts its lightness.
# Two values are deliberately not mirrors:
#
# `primaryColor` is #605EEF, searched rather than picked, because Streamlit puts
# this one token to two jobs that pull opposite ways:
#   A. it fills primary buttons, whose label Streamlit hardcodes to white
#      (verified: set this to #FAFAFA and you get white on #FAFAFA, 1.04:1 -- it
#      does not restyle the label to suit a light fill), so A wants it DARK;
#   B. it is the foreground of selected controls -- the Source/Rendered segmented
#      control in `render_file` and `approval_panel` draws its lit segment in this
#      colour over a 10%-alpha wash of itself -- so B wants it LIGHT.
# On a near-black page the two curves cross around 4.4:1, and no hue escapes
# that: contrast is luminance, and choosing a hue doesn't change luminance. No
# Tailwind indigo step clears both -- indigo-500 gives 4.47 / 4.10 (the label
# fails AA), indigo-600 gives 6.29 / 2.98 (the segment fails 3:1). #605EEF gives
# A 4.83:1 and B 3.82:1 (3.30:1 on the dark sidebar), the same budget the zinc-500
# it replaces had, with hue as a second cue. That order is deliberate: a button
# label has no other cue, while a lit segment also carries its wash and border,
# and the Source/Rendered control is the one thing saying whether the pane shows
# the bytes that get written. Avoid #6365F1: it lands at exactly 4.50, with no
# margin.
#
# `linkColor` is indigo-300 (9.91:1), the light link's hue lifted for a dark page.
# Left unset, Streamlit falls back to `blueTextColor`, not to `primaryColor`, so
# links would turn a light blue unrelated to the accent.

[theme.dark]
primaryColor = "#605EEF"              # searched indigo; see above
backgroundColor = "#0C0A09"           # stone-950
secondaryBackgroundColor = "#1C1917"  # stone-900
codeBackgroundColor = "#292524"       # stone-800
textColor = "#FAFAF9"                 # stone-50
linkColor = "#A5B4FC"                 # indigo-300
borderColor = "#78716C"               # stone-500, 3:1 on every dark surface
codeTextColor = "#E7E5E4"             # stone-200
dataframeBorderColor = "#44403C"      # stone-700
dataframeHeaderBackgroundColor = "#1C1917"

[theme.dark.sidebar]
backgroundColor = "#1C1917"           # stone-900
secondaryBackgroundColor = "#292524"  # stone-800
codeBackgroundColor = "#44403C"       # stone-700
textColor = "#FAFAF9"
borderColor = "#78716C"
primaryColor = "#605EEF"
dataframeHeaderBackgroundColor = "#292524"
dataframeBorderColor = "#44403C"
