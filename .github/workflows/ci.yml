name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant -- except on
# main, where a run can cut a release. Cancelling one mid-`gh release create`
# leaves a tag with no release behind it, which the idempotency check below then
# reads as "already released" forever. PR churn is what this setting is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The default for every job. `release` overrides it -- job-level permissions
# replace this block rather than merging with it, so that job holds
# contents:write and nothing else.
permissions:
  contents: read

# tests/conftest.py already forces these off; this covers the non-pytest steps
# too -- `grant-writer --help`, `uv build`, and whatever gets added later. It
# has to state the *whole* rule and not just the half about switches, because
# "the guarantee does not depend on pytest" is only true while this block says
# everything conftest says. See invariant 19.
#
# All four spellings of the switch, because langsmith reads TRACING_V2 before
# TRACING and searches the LANGSMITH_ then LANGCHAIN_ namespace for each --
# setting one leaves three live. The value must be "false" and never "":
# `get_env_var` skips a value that strips to nothing and resumes the namespace
# fallback, so an empty switch delegates the decision rather than settling it.
#
# The last three are empty for the opposite reason -- for them empty and
# absent are the same thing to every consumer, and no value of a credential
# can turn tracing on, so the fallback runs out of names instead of finding a
# "true". That is the half which does not depend on the four names above
# being complete. LANGCHAIN_HANDLER is emptied because forcing v2 off is what
# arms the retired v1 tracer: `callbacks/manager.py` raises RuntimeError when
# LANGCHAIN_TRACING or LANGCHAIN_HANDLER reads as set while v2 is not.
#
# No real secrets are configured on purpose -- conftest supplies a dummy
# ANTHROPIC_API_KEY and blanks TAVILY_API_KEY, so a test that needs a real
# credential is a bug in the suite, and CI is where that should surface.
env:
  LANGSMITH_TRACING_V2: "false"
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING: "false"
  LANGCHAIN_HANDLER: ""
  LANGSMITH_API_KEY: ""
  LANGCHAIN_API_KEY: ""

jobs:
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Whether a failure is 3.14-only or universal is most of the diagnosis,
      # and cancelling the sibling job hides exactly that.
      fail-fast: false
      matrix:
        # requires-python is ">=3.13", so 3.14 is claimed and has to be tested
        # or the claim is only an assertion. .python-version (3.13) remains what
        # local development and a bare `uv run` use.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Sets UV_PYTHON, so the sync below builds on this interpreter rather
          # than the one .python-version names. uv fetches it itself, so there
          # is no setup-python step.
          python-version: ${{ matrix.python-version }}

      # --locked fails on a stale uv.lock rather than quietly re-resolving. One
      # lockfile serves both legs; uv resolves universally across requires-python.
      # Never add --no-dev: streamlit is a dev dependency and the AppTest cases
      # in test_frontends.py are the only coverage streamlit_app.py has.
      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest tests/ -q

      # Exercises [project.scripts], the uv_build packaging, and _resolve_root().
      # The unit tests import modules directly and would not notice a broken
      # entry point.
      - name: Smoke-test the entry point
        run: uv run grant-writer --help

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # One interpreter on purpose, .python-version's 3.13: lint and types are a
      # property of the source, not the runtime, and the ty baseline was measured
      # there. ruff needs no project install but ty does -- including the dev
      # group, since tests/ imports streamlit and ty resolves imports statically.
      - name: Install
        run: uv sync --locked

      # Pinned on purpose. [tool.ruff.lint] selects whole families, so a release
      # that adds a rule to any of them turns CI red on code that did not change.
      # Bump deliberately, with the fixes in the same commit.
      - name: Lint
        run: uvx ruff@0.16.4 check src/ tests/ evals/ streamlit_app.py

      - name: Format
        run: uvx ruff@0.16.4 format --check src/ tests/ evals/ streamlit_app.py

      # A ratchet, not a gate. ty reports two diagnostics today, both upstream
      # and neither worth suppressing (CLAUDE.md says which). Failing on any
      # would keep CI permanently red and teach everyone to ignore this job;
      # skipping ty would let a real diagnostic of ours land unnoticed. The same
      # baseline is enforced at edit time by the ty hook in .claude/settings.json
      # -- keep the two in step, and re-check both when bumping the pin below.
      - name: Type check
        env:
          TY_BASELINE: 2
        run: |
          uvx ty@0.0.74 check src/ tests/ evals/ streamlit_app.py > ty.log 2>&1 || true
          cat ty.log

          count=$(sed -n 's/^Found \([0-9][0-9]*\) diagnostic.*/\1/p' ty.log | tail -1)
          if [ -z "$count" ]; then
            grep -q 'All checks passed' ty.log || {
              echo "::error::could not read a diagnostic count from ty -- did its output format change?"
              exit 1
            }
            count=0
          fi

          if [ "$count" -gt "$TY_BASELINE" ]; then
            echo "::error::ty reports ${count} diagnostics, above the baseline of ${TY_BASELINE}. The new one is ours -- fix it rather than raising the baseline."
            exit 1
          fi
          if [ "$count" -lt "$TY_BASELINE" ]; then
            echo "::notice::ty reports only ${count}; lower TY_BASELINE to ${count} to keep the ratchet tight."
          fi

  release:
    name: Release
    # `needs` is the whole point: a tag must never be cut from a red commit.
    # pull_request events carry refs/pull/N/merge and workflow_dispatch carries
    # whichever branch it was run on, so this one condition excludes both.
    if: github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The existence of the tag is the release trigger, not a diff of
      # pyproject.toml against HEAD^. Diffing breaks on squash merges, on
      # re-runs, and on any force-push; this is idempotent and does not care how
      # the commit landed. It also self-heals: if a bump lands and the next push
      # arrives before this job runs, the later run still sees the bumped version
      # with no tag and releases it, just from a newer commit.
      #
      # ls-remote rather than a local `git tag -l`, so the answer does not depend
      # on the checkout having fetched tags. No fetch-depth: 0 needed.
      - name: Decide whether to release
        id: check
        run: |
          version=$(uv version --short)
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "::notice::${tag} is already tagged -- no version bump to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${tag} is not tagged yet -- releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # No `uv sync`: the build backend needs the source and pyproject.toml, not
      # an installed environment. This is also the only place the shipped
      # artifact itself is built rather than an editable install.
      - name: Build
        if: steps.check.outputs.release == 'true'
        run: uv build

      # `gh release create` creates the tag itself, so this is one operation
      # rather than tag-push-then-release with a window in between. The glob
      # skips the .gitignore uv writes into dist/ -- named explicitly anyway,
      # since a bare dist/* would attach whatever else ends up there.
      - name: Tag and release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz
