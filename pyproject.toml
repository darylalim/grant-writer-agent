[project]
name = "grant-writer"
version = "0.1.1"
description = "A grant writing agent on Deep Agents: find funding opportunities, fit-score them, and draft the proposal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daryl Lim", email = "73304404+darylalim@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    # >=0.7 is required, not merely preferred: `build_backend` returns a
    # backend *instance* (0.7 removed factories and raises TypeError on the old
    # shape) and `agent.py` passes `TodoListMiddleware` explicitly, which 0.6
    # installed itself and would double-register. Upper-bounded because 0.6->0.7
    # is what taught this project that a deepagents minor is a breaking lane: it
    # removed the todo middleware, added a live `delete` tool to every graph,
    # and dropped ~5.6k characters of system prompt -- only the first of which
    # any test could see. Bump deliberately, with the audit in the same commit.
    "deepagents>=0.7.8,<0.8",
    "httpx>=0.27",
    "langchain>=1.0,<2.0",
    # >=1.5.2 is the first release carrying the claude-opus-5 profile (context
    # window, effort levels, no sampling params). `config.build_model` sets
    # max_tokens explicitly, so an older release no longer truncates output --
    # but the rest of the profile still informs the model's behaviour. Upper
    # bound matches the other langchain pins.
    "langchain-anthropic>=1.5.2,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    # >=0.6.7 is a correctness floor, not hygiene. `Client.create_feedback`
    # ends in `**kwargs`, and `session_id` -- the argument the deprecated
    # run_id-only form was replaced by -- is only a named parameter from
    # 0.6.7 (bisected: absent in 0.6.6, present in 0.6.7). Below it,
    # `evals/run_scout.py` still passes it, langsmith drops it into
    # `**kwargs`, and the DeprecationWarning that says so is raised inside
    # `langsmith.client` rather than `__main__`, where Python's default
    # filter ignores it: every feedback write reverts to the deprecated
    # path with no error and nothing on screen. Nothing resolves that low
    # today because `deepagents` itself asks for a newer langsmith -- this
    # says the floor is *ours*, so relaxing that pin cannot quietly drop
    # it. Capped because the same `**kwargs` will swallow a *removed*
    # keyword exactly as quietly as an unrecognised one.
    "langsmith>=0.6.7,<1.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
grant-writer = "grant_writer.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "streamlit[pdf]>=1.60.0",
]

[tool.pytest.ini_options]
# The repo root, so `tests/test_evals.py` can import `evals`. The build backend
# is src-layout, so only `src/` is installed and the root is otherwise off the
# path -- and `evals/` is deliberately not shipped in the wheel, being a
# development instrument like `tests/` itself.
#
# This does NOT put the evals themselves in the suite: `evals/` contains no
# `test_*.py`, and the one thing collected from it is the offline scorer test
# in `tests/`. The eval runner needs a live API key and must stay uncollectable
# -- see `evals/__init__.py`.
pythonpath = ["."]

[tool.ruff.lint]
# The source already satisfied every rule below before this section existed, so
# it is a ratchet on the standard the code was written to, not a cleanup to work
# through. Ruff's defaults are only E4/E7/E9/F, which say nothing about import
# order (I), stale idioms (UP), or the mutable-default and loop-variable class of
# bug (B) -- all things that survive review by looking unremarkable.
#
# BLE is here because `tools.py` already carries `# noqa: BLE001` on two
# deliberate broad excepts. Selecting RUF without BLE would make RUF100 flag
# those directives as unused and invite deleting the suppression along with the
# rule that justified it.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "BLE", "RUF"]
