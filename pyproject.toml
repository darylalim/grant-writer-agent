[project]
name = "grant-writer"
version = "0.1.0"
description = "A grant writing agent built on Deep Agents"
readme = "README.md"
authors = [
    { name = "Daryl Lim", email = "73304404+darylalim@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.0,<2.0",
    # >=1.5.2 for the claude-opus-5 model profile. On an older release the
    # model id is unknown to the profile registry and `max_tokens` silently
    # falls back to 4096 instead of 128000 -- see test_model_profile_is_known.
    "langchain-anthropic>=1.5.2",
    "langchain-core>=1.0,<2.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.3.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
grant-writer = "grant_writer.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
